<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Kajetan Mieszkania</title>
  <style>
    :root{
      --bg:#f6f8fb;--card:#ffffff;--border:#dbe3ef;--text:#0f172a;--muted:#64748b;
      --green:#16a34a;--green-soft:#f0fdf4;--blue:#1d4ed8;--blue-soft:#eff6ff;
      --amber:#d97706;--amber-soft:#fff7ed;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f8fafc 0%,#eef6ff 100%);color:var(--text);}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{width:min(100%,420px);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.08);}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);text-align:center;}
    h1{font-size:28px;line-height:1.05;margin:10px 0 6px;text-align:center;}
    .sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:22px;}
    .month{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;display:inline-flex;justify-content:center;width:100%;margin-bottom:18px;}
    .status{border-radius:18px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--border);}
    .status.paid{background:var(--green-soft);border-color:#86efac;}
    .status.open{background:var(--amber-soft);border-color:#fdba74;}
    .status .label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
    .status .value{font-size:24px;font-weight:800;margin-top:6px;}
    .status .meta{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45;}
    .btn{width:100%;border:none;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .12s ease,opacity .12s ease;}
    .btn:active{transform:scale(.99)}
    .btn.primary{background:var(--green);color:#fff;}
    .btn.secondary{background:#fff;border:1px solid var(--border);color:var(--text);margin-top:10px;}
    .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.45;}
    .error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:14px;}
    .loading{font-size:14px;color:var(--muted);text-align:center;padding:30px 0;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">Quick Pay</div>
      <h1>Kajetan Mieszkania</h1>
      <div class="sub">Jednym kliknięciem oznaczysz płatność jako opłaconą. Status od razu pojawi się w dashboardzie.</div>
      <div id="app" class="loading">Ładowanie…</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const DEFAULT_SYNC_URL = '';
    const SYNC_URL = urlParams.get('syncUrl') || localStorage.getItem('kajetan_sync_url') || DEFAULT_SYNC_URL;
    const QUICK_KEY = urlParams.get('key') || 'kajetan-mobile-otv-2026';

    if(urlParams.get('syncUrl')){
      localStorage.setItem('kajetan_sync_url', urlParams.get('syncUrl'));
    }

    const fmtMoney = v => new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
    const monthLabel = key => {
      const m=String(key||'').match(/^(\d{4})-(\d{2})$/);
      if(!m)return key||'';
      const names=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
      return `${names[Number(m[2])-1]} ${m[1]}`;
    };
    const esc = s => String(s||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    let state = { monthKey:'', monthLabel:'', amount:7253.58, paidDate:'', status:'open' };

    function render(content){ document.getElementById('app').innerHTML = content; }

    function renderState(){
      const paid = state.status === 'paid';
      render(`
        <div class="month">${esc(state.monthLabel || monthLabel(state.monthKey))}</div>
        <div class="status ${paid?'paid':'open'}">
          <div class="label">Status</div>
          <div class="value">${paid?'Opłacona':'Do oznaczenia'}</div>
          <div class="meta">
            Kwota: <strong>${fmtMoney(state.amount)} zł</strong><br>
            ${paid ? `Data opłacenia: <strong>${esc(state.paidDate)}</strong>` : 'Po kliknięciu zapisze się dzisiejsza data.'}
          </div>
        </div>
        <button class="btn primary" onclick="markPaid()">Opłacono dzisiaj</button>
        ${paid?'<button class="btn secondary" onclick="loadStatus()">Odśwież status</button>':''}
        <div class="hint">Działa dla bieżącego miesiąca. Jeśli dziś klikniesz, status Kajetana w Płatnościach Artura zmieni się automatycznie.</div>
      `);
    }

    function renderError(msg){
      render(`
        <div class="error">${esc(msg)}</div>
        <button class="btn secondary" onclick="loadStatus()">Spróbuj ponownie</button>
      `);
    }

    async function loadStatus(){
      if(!SYNC_URL){
        renderError('Brak adresu backendu. Otwórz stronę z parametrem syncUrl albo wpisz go do pliku przed publikacją.');
        return;
      }
      render('<div class="loading">Sprawdzam status…</div>');
      try{
        const url = `${SYNC_URL}?action=getKajetanQuickStatus&key=${encodeURIComponent(QUICK_KEY)}`;
        const res = await fetch(url);
        const data = await res.json();
        if(!data || data.error) throw new Error(data?.error || 'Nie udało się pobrać statusu.');
        state = { ...state, ...data };
        renderState();
      }catch(e){
        renderError(e.message || 'Błąd połączenia z backendem.');
      }
    }

    async function markPaid(){
      if(!SYNC_URL){
        renderError('Brak adresu backendu. Otwórz stronę z parametrem syncUrl albo wpisz go do pliku przed publikacją.');
        return;
      }
      render('<div class="loading">Zapisuję płatność…</div>');
      try{
        const res = await fetch(SYNC_URL,{
          method:'POST',
          headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({
            action:'markKajetanPaidQuick',
            key:QUICK_KEY,
            monthKey:state.monthKey,
            amount:state.amount
          })
        });
        const data = await res.json();
        if(!data || data.error) throw new Error(data?.error || 'Nie udało się zapisać płatności.');
        state = { ...state, ...data };
        renderState();
      }catch(e){
        renderError(e.message || 'Błąd zapisu.');
      }
    }

    loadStatus();
  </script>
</body>
</html>
